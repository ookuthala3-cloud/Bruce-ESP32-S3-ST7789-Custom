[env:esp32-s3-st7789]
board = esp32-s3-devkitc-1
board_build.partitions = custom_16Mb.csv

build_src_filter =
    ${env.build_src_filter}
    +<../boards/ESP32-S3-ST7789>

build_flags =
    ${env.build_flags}
    -Iboards/ESP32-S3-ST7789
    -Os
    -DCORE_DEBUG_LEVEL=1

    ; =========================
    ; Board
    ; =========================
    -DESP32_S3_ST7789
    -DDEVICE_NAME='"ESP32-S3-ST7789"'

    ; =========================
    ; Display ST7789 240x240
    ; =========================
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_RGB_ORDER=TFT_RGB
    -DSMOOTH_FONT=1

    -DTFT_CS=16
    -DTFT_DC=7
    -DTFT_RST=15
    -DTFT_MOSI=6
    -DTFT_SCLK=5
    -DTFT_MISO=41
    -DTFT_BL=4

    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_SPI_PORT=FSPI

    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000

    -DHAS_SCREEN=1
    -DROTATION=1
    -DMINBRIGHT=1

    -DFP=1
    -DFM=2
    -DFG=3

    ; =========================
    ; SD Card
    ; =========================
    -DSDCARD_CS=40
    -DSDCARD_SCK=5
    -DSDCARD_MISO=41
    -DSDCARD_MOSI=6

    ; =========================
    ; Main SPI
    ; =========================
    -DSPI_SCK_PIN=5
    -DSPI_MOSI_PIN=6
    -DSPI_MISO_PIN=41
    -DSPI_SS_PIN=11

    ; =========================
    ; I2C / Grove
    ; =========================
    -DGROVE_SDA=18
    -DGROVE_SCL=8

    ; =========================
    ; CC1101
    ; =========================
    -DUSE_CC1101_VIA_SPI
    -DCC1101_GDO0_PIN=21
    -DCC1101_SS_PIN=47
    -DCC1101_MOSI_PIN=6
    -DCC1101_SCK_PIN=5
    -DCC1101_MISO_PIN=41

    ; =========================
    ; NRF24L01
    ; =========================
    -DUSE_NRF24_VIA_SPI
    -DNRF24_CE_PIN=14
    -DNRF24_SS_PIN=48
    -DNRF24_MOSI_PIN=6
    -DNRF24_SCK_PIN=5
    -DNRF24_MISO_PIN=41

    ; =========================
    ; IR
    ; =========================
    -DIR_TX_PINS='{{"IR TX", 1}}'
    -DIR_RX_PINS='{{"IR RX", 2}}'
    -DTXLED=48
    -DLED_ON=HIGH
    -DLED_OFF=LOW

    ; =========================
    ; 5 Push Buttons
    ; =========================
    -DBTN_UP=12
    -DBTN_DOWN=13
    -DBTN_LEFT=17
    -DBTN_RIGHT=9
    -DBTN_SELECT=14

    ; =========================
    ; Battery
    ; =========================
    -DBAT_PIN=10

lib_deps =
    ${env.lib_deps}
